<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vestige - write a letter to your future self, seal it with a date, and let time do the rest.">
  <title>Vestige</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23108B4F' rx='7'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dy='.35em' fill='%23FAF6EA' font-size='20' font-family='Georgia,serif' font-style='italic'%3EV%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-name">Vestige</span>
        <span class="brand-tag">your words, <em class="accent">preserved</em></span>
      </div>
      <button class="btn-new" id="btn-new">New Capsule</button>
    </div>
  </header>

  <main class="site-main">

    <!-- shown when no capsules exist yet -->
    <div class="hero" id="empty-state">
      <p class="hero-headline">Write a <em class="accent">letter</em> to your future self.</p>
      <p class="hero-sub">Seal it with a date. When the day arrives, it will be waiting.</p>
      <button class="btn-new btn-hero" id="btn-hero">Seal your first capsule</button>
    </div>

    <!-- capsule cards go here -->
    <div class="capsules-grid" id="capsules-grid"></div>

  </main>

  <!-- === CREATE MODAL === -->
  <div class="overlay" id="overlay-create">
    <div class="modal modal-create">

      <button class="modal-close" id="close-create" aria-label="Close">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <h2 class="modal-heading">Seal a <em class="accent">capsule</em></h2>
      <p class="modal-sub">This message stays hidden until the date you set.</p>

      <div class="field">
        <label for="f-title">Title</label>
        <input type="text" id="f-title" placeholder="Give this capsule a name" maxlength="60" autocomplete="off" spellcheck="false">
      </div>

      <div class="field">
        <label for="f-message">Your message</label>
        <textarea id="f-message" rows="7" placeholder="Write to your future self..."></textarea>
      </div>

      <div class="field">
        <label>Unlock on</label>
        <div class="quick-dates">
          <button class="qdates-btn" data-months="1">1 month</button>
          <button class="qdates-btn" data-months="3">3 months</button>
          <button class="qdates-btn" data-months="6">6 months</button>
          <button class="qdates-btn" data-months="12">1 year</button>
        </div>
        <input type="date" id="f-date">
        <span class="field-hint" id="f-date-label"></span>
      </div>

      <button class="btn-seal" id="btn-seal">Seal Capsule</button>

    </div>
  </div>

  <!-- === READ MODAL === -->
  <div class="overlay" id="overlay-read">
    <div class="modal modal-read">

      <button class="modal-close" id="close-read" aria-label="Close">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <p class="read-eyebrow">opened</p>
      <p class="read-meta-date" id="read-meta-date"></p>
      <h2 class="read-title" id="read-title"></h2>
      <div class="read-divider"></div>
      <div class="read-body" id="read-body"></div>
      <button class="btn-delete-modal" id="btn-delete-modal">Delete this capsule</button>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
