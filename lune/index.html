<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="bg" aria-hidden="true"></canvas>

  <div class="wrap">

    <header class="site-header">
      <h1 class="logo">Lune</h1>
      <p class="tagline">tonight's <em>illumination</em></p>
    </header>

    <main>

      <section class="moon-stage" aria-label="Current moon phase">
        <div class="moon-frame">
          <canvas
            id="moon"
            width="280"
            height="280"
            role="img"
            aria-label="Moon phase visualization"
            title="Click for a lunar fact"
          ></canvas>
        </div>
        <p class="phase-label">
          <span id="phaseWord1"></span><em id="phaseWord2"></em>
        </p>
        <p class="illum-line">
          <span class="mono" id="illumPct">0</span>%&nbsp;<em>illuminated</em>
        </p>
      </section>

      <div class="cards" role="list">
        <div class="card" role="listitem">
          <div class="card-val mono" id="moonAge">0.0</div>
          <div class="card-lbl">days <em>old</em></div>
        </div>
        <div class="card card--hi" role="listitem">
          <div class="card-val mono" id="toFull">--</div>
          <div class="card-lbl">until <em>full</em></div>
        </div>
        <div class="card" role="listitem">
          <div class="card-val mono" id="toNew">--</div>
          <div class="card-lbl">until <em>new</em></div>
        </div>
      </div>

      <p class="tidbit" id="tidbit"></p>

      <section class="cal-section" aria-label="Monthly lunar calendar">
        <p class="cal-month" id="calMonth"></p>
        <div class="dow" aria-hidden="true">
          <span>Su</span><span>Mo</span><span>Tu</span>
          <span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </section>

    </main>

    <footer class="site-footer">
      <p>phases <em>calculated</em> in your browser, nothing sent anywhere</p>
    </footer>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
